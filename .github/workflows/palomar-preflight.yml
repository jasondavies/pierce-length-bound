name: Full Palomar mechanical preflight

# Run manually after pushing the intended snapshot to the public repository.
# This verifies the selected commit; it does not submit or register the result.
on:
  workflow_dispatch:
    inputs:
      authorization_relationship:
        description: Your relationship to the substantive formalization
        required: true
        type: choice
        options:
          - I am a responsible author or maintainer
          - I have approval from a responsible author or maintainer

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"comparator.json","authorization_relationship":${{ toJSON(inputs.authorization_relationship) }}}
