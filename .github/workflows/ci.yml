name: Lean and Palomar checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Check Palomar metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the pinned Palomar metadata validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
          path: .lake/palomar-tools
          persist-credentials: false
      - name: Set up the validator's Python version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.10"
      - name: Install the validator dependency
        run: python3 -m pip install --require-hashes -r .lake/palomar-tools/requirements.txt
      - name: Check the pinned CCDN dependency metadata
        run: python3 scripts/check-curve-counting-dependency.py
      - name: Validate metadata, source layout, and theorem lists
        run: |
          python3 scripts/check-lean-sources.py
          PYTHONPATH=.lake/palomar-tools python3 - <<'PY'
          from pathlib import Path
          from scripts.submission_contract import load_formalization_metadata
          load_formalization_metadata(Path("formalization.yaml"))
          print("Palomar metadata contract passed")
          PY

  lean:
    name: Build, audit axioms, and compare statements
    # The fast metadata and source checks gate the long build.
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The dependency checks read lakefile.toml with tomllib (Python 3.11 or later).
      - name: Set up Python for the dependency checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.10"
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
      - name: Check the fetched CCDN checkout
        run: python3 scripts/check-curve-counting-dependency.py --checkout
      - name: Check the weighted-count dependencies of the main bounds
        run: python3 scripts/check-weighted-count-dependencies.py
      - name: Install Comparator's Linux sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 and later restrict unprivileged user namespaces via AppArmor,
          # which bwrap needs for Comparator's sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compare every theorem in comparator.json with Lean, NanoDa, and con-ron
        run: bash scripts/verify-comparator.sh
