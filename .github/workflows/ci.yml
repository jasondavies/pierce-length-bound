name: Lean and Palomar checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # The change detector reads earlier runs of this workflow.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether the long Lean job is needed. A push is compared with the last commit
  # on its branch whose run of this workflow succeeded, so a Lean change whose run was
  # cancelled by a later push is still checked; a pull request is compared with its base.
  # Changes confined to the paper and Markdown files skip the Lean job; the metadata job,
  # which also checks the paper's citations, always runs. Any doubt runs the build.
  changes:
    name: Detect Lean-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lean: ${{ steps.diff.outputs.lean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Compare with the last verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          case "$EVENT" in
            push)
              base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" \
                --branch "$BRANCH" --event push --status success --limit 1 \
                --json headSha --jq '.[0].headSha // ""' || true) ;;
            pull_request) base="$PR_BASE" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null \
              || ! git merge-base --is-ancestor "$base" HEAD; then
            echo "No usable base commit; running the Lean job."
            echo "lean=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^paper/|\.md$' | grep -q .; then
            echo "lean=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only paper or Markdown files changed; skipping the Lean job."
            echo "lean=false" >> "$GITHUB_OUTPUT"
          fi

  metadata:
    name: Check Palomar metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the pinned Palomar metadata validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
          path: .lake/palomar-tools
          persist-credentials: false
      - name: Set up the validator's Python version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.10"
      - name: Install the validator dependency
        run: python3 -m pip install --require-hashes -r .lake/palomar-tools/requirements.txt
      - name: Check the pinned CCDN dependency metadata
        run: python3 scripts/check-curve-counting-dependency.py
      - name: Check the selected theorem lists
        run: python3 scripts/check-theorem-lists.py
      - name: Validate metadata and source layout
        run: |
          python3 scripts/check-lean-sources.py
          PYTHONPATH=.lake/palomar-tools python3 - <<'PY'
          from pathlib import Path
          from scripts.submission_contract import load_formalization_metadata
          load_formalization_metadata(Path("formalization.yaml"))
          print("Palomar metadata contract passed")
          PY

  lean:
    name: Build, audit axioms, and compare statements
    # The fast metadata and source checks gate the long build, which is skipped when
    # only the paper or Markdown files changed.
    needs: [changes, metadata]
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    # A cold build takes about 40 minutes, and Comparator replays the whole environment.
    timeout-minutes: 120
    steps:
      # Mathlib, CCDN, this project and Comparator need about 20 GB, more than a standard
      # runner has free. Remove preinstalled toolchains that the job does not use.
      - name: Free disk space for the Mathlib and CCDN builds
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The dependency checks read lakefile.toml with tomllib (Python 3.11 or later), and the
      # --checkout check runs CCDN's own provenance script, which needs Python 3.12 or later.
      - name: Set up Python for the dependency checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
      - name: Check the fetched CCDN checkout
        run: python3 scripts/check-curve-counting-dependency.py --checkout
      - name: Check the weighted-count dependencies of the main bounds
        run: python3 scripts/check-weighted-count-dependencies.py
      # Comparator replays the whole environment through three kernels (about 15
      # minutes), so it runs on main, on pull requests and on manual runs only.
      - name: Install Comparator's Linux sandbox
        if: github.ref == 'refs/heads/main' || github.event_name != 'push'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 and later restrict unprivileged user namespaces via AppArmor,
          # which bwrap needs for Comparator's sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compare every theorem in comparator.json with Lean, NanoDa, and con-ron
        if: github.ref == 'refs/heads/main' || github.event_name != 'push'
        run: bash scripts/verify-comparator.sh
