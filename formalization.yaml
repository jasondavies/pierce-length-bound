status:
  scope: >-
    Comparator is configured for the main theorems listed in alignment below.
    Their definitions are given in full in the independent Mathlib-only
    Challenge module. The proof development has no sorry holes or custom
    axioms. The deliberate theorem holes in Challenge.lean are excluded
    from these counts. NairTenenbaumDelta and BretecheTenenbaumMean are
    unproved propositions passed as hypotheses, not axioms. The selected
    polar-projection bounds are unconditional: PolarProjectionMain supplies
    the proved six-term counting estimates to the general exponent reductions.
    The paper's
    background literature and its remark about Shiu's theorem are not
    claimed as formalised results. The O((log a)^2) conjecture is not proved.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: agent
      models: ["GPT-6-Astra (OpenAI)"]
      framework: "Codex"
      tool_setup: >-
        Found all the mathematical results and the key steps of their proofs, during
        an investigation initiated by the author. Under the author's direction, wrote
        and revised the Lean development (including the rational curve geometry,
        normalisation and valuation arguments, joint-invariant graphs, exterior-lattice
        bounds, polar-projection identities, effective Hilbert irreducibility and the
        external curve-counting theorem), the paper and the documentation, reviewed
        them, and prepared the Palomar packaging and CI.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        Under the author's direction, revised the paper's exposition, restructured
        parts of the Lean development (module consolidation, linting, the six-term
        proof of the 3/10 bound, the divisor-bound range), revised the documentation
        and CI, reviewed them, and ran the Comparator checks.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
  spend_usd: "not tracked"
  notes: >-
    The work was produced entirely by AI systems. GPT-6-Astra found the results
    during an investigation initiated by the human author, who then directed
    GPT-6-Astra (via Codex) and Claude Opus 5.5 (via Claude Code) to formalise them
    in Lean and to write the manuscript; both contributed to the formalisation and
    to the review and revision of the manuscript. The author wrote no part of the
    text or the Lean code. Correctness of the formal results rests on Lean's kernel;
    the statements compared by Palomar's comparator are also checked by its
    independent kernels. The paper carries the same disclosure.

fidelity:
  divergences: >-
    No known mismatch between the compared Lean statements and their
    descriptions in the accompanying paper. The log-log result explicitly
    assumes two published analytic statements instead of formalising their
    proofs. The polar-projection refinement proves its six-term local counting
    estimate, including all arithmetic and geometric inputs.
    The natural-number orbit is frozen at zero, and P counts positive terms;
    both the paper and orb use zero-based indexing.

review:
  status: "agent-reviewed"
  reviewers:
    - "GPT-6-Astra (OpenAI), via Codex: AI review"
    - "Claude Opus 5.5 (Anthropic), via Claude Code: AI review"
  notes: >-
    Latest run, October 26, 2026, with hankelInv_first_four among the compared
    statements and the CCDN dependency pinned to the Palomar-registered commit
    bb025e7207f3a35a21b898629f5678b72aa7e44f: the Lean build, both weighted-count
    dependency audits, the CCDN metadata and checkout checks and the axiom audit
    passed. The axiom audit covers every exported PierceLengthBound, CCDN and
    vendored ArithmeticHeights declaration and allows only propext,
    Classical.choice and Quot.sound; it covered 3,498 PierceLengthBound, 455 CCDN
    and 554 ArithmeticHeights declarations. In an isolated copy with matching Lean
    sources and dependency configuration, the standard sandboxed Comparator
    accepted all sixteen selected statements with Lean, NanoDa and con-ron;
    con-ron verified 91,407 declarations.
    In the same run, scripts/verify-polar-kernels.py accepted its thirty principal
    polar endpoints with Lean, NanoDa and con-ron at their standard limits; con-ron
    verified 90,395 declarations and NanoDa checked 92,993 with no typechecker
    errors. These include the proved six-term estimate, its arithmetic sieve, the
    actual common-base bound, and the general exponent reductions. These
    supplementary statements are not independently compared with Challenge; the
    sixteen public statements are checked separately by Comparator.
    Also on October 26, scripts/check-polar-projection.py independently recomputed the
    polar and base-point identities, quartic certificate, irreducible sextic
    specialisation and polar exponent arithmetic using SymPy.
    Earlier checker resource failures were repaired by making coefficient
    conversions explicit and separating monic irreducibility transfer into
    smaller lemmas, without changing hypotheses or checker limits.
    An October 19, 2026 Codex review, which predates the joint-invariant and
    exterior-lattice bounds, read the full paper, checked the definitions and
    theorem statements against it, and inspected the main proof dependencies. It
    corrected the description of quadratic nondegeneracy, the Nair–Tenenbaum
    parameter mapping, and the scope of the no-sorry claim. The reproducible
    scripts/check-math.py checks 26,554 exact-rational Hankel determinants through
    order six on 2,274 orbits, plus curvature, six-step, pattern, quartic and minor
    identities.
    The subsequent full repository and manuscript review clarified the integer
    specialisation domain and degree/height conventions, supplied the branch-label
    and common-base arguments, explained the hypersurface-pattern estimate, and
    reorganised the exposition around the strongest bound. It also corrected the
    orbit indexing in documentation and distinguished CI from manual release checks.
    The weighted-count audit now explicitly excludes all three half-weight estimates;
    direct and transitive negative checks confirmed that those dependencies are
    rejected. A fresh Lean build, axiom audit, source and dependency checks, and exact
    arithmetic checks passed. The displayed quartic and finite-field certificates
    were independently recomputed with exact arithmetic. The revised PDF builds
    without LaTeX warnings, and its theorem numbers match the alignment below.
    The Lean theorem statements and proof bodies are unchanged by this revision.
    This is an automated review, not independent human peer review. The existing
    provenance record reports no additional human review. The maintainer reports
    that the results, the Lean code and the manuscript were produced entirely by AI
    (GPT-6-Astra via Codex, Claude Opus 5.5 via Claude Code).
    Full Palomar mechanical preflight remains outstanding. No
    external endorsement is claimed.

alignment:
  namespace: "PierceLengthBound"
  statements:
    - source: "Optimised polar-projection bound, Theorem 1.1"
      lean: "PierceLengthBound.P_le_polar_optimal"
      module: "PierceLengthBound.PolarProjectionMain"
      status: proved
      note: "Uniform in a and b, including proved curve counting and effective Hilbert irreducibility."
    - source: "Rational polar-projection bound, Theorem 10.9 with (m, n) = (3, 2)"
      lean: "PierceLengthBound.P_le_4317_14677"
      module: "PierceLengthBound.PolarProjectionMain"
      status: proved
    - source: "Optimised exterior-lattice bound, Theorem 1.3"
      lean: "PierceLengthBound.P_le_lattice_optimal"
      module: "PierceLengthBound.LatticeJointMain"
      status: proved
      note: "Uniform in a and b, including the proved external curve theorem."
    - source: "Rational exterior-lattice bound, Corollary 9.11 with (m, n) = (3, 2)"
      lean: "PierceLengthBound.P_le_153_520"
      module: "PierceLengthBound.LatticeJointMain"
      status: proved
    - source: "Optimised joint-invariant bound, Theorem 1.2"
      lean: "PierceLengthBound.P_le_joint_optimal"
      module: "PierceLengthBound.JointLiftMain"
      status: proved
      note: "Uniform in a and b, including the proved external curve theorem."
    - source: "Rational powered joint-invariant bound, Corollary 8.15 with (m, n) = (50, 51)"
      lean: "PierceLengthBound.P_le_2201_7480"
      module: "PierceLengthBound.JointLiftMain"
      status: proved
    - source: "Unpowered joint-invariant bound, Corollary 8.15 with (m, n) = (1, 1)"
      lean: "PierceLengthBound.P_le_128_435"
      module: "PierceLengthBound.JointLiftMain"
      status: proved
    - source: "Earlier lattice bound, Section 1 (Intermediate bounds)"
      lean: "PierceLengthBound.P_le_45_152"
      module: "PierceLengthBound.FortyFiveMain"
      status: proved
      note: "Uniform in a and b; C may depend on the positive epsilon."
    - source: "Minor-vector counting bound, Section 1 (Intermediate bounds)"
      lean: "PierceLengthBound.P_le_8_27"
      module: "PierceLengthBound.EightMain"
      status: proved
    - source: "Ternary slicing bound, Section 1 (Intermediate bounds)"
      lean: "PierceLengthBound.P_le_11_37"
      module: "PierceLengthBound.ElevenMain"
      status: proved
    - source: "Seven-integer pattern bound, Section 1 (Intermediate bounds)"
      lean: "PierceLengthBound.P_le_23_77"
      module: "PierceLengthBound.TwentyThreeMain"
      status: proved
    - source: "Unconditional 3/10 bound, Theorem 1.4"
      lean: "PierceLengthBound.P_le"
      module: "PierceLengthBound.Main"
      status: proved
    - source: "Conditional logarithmic refinement, Section 12"
      lean: "PierceLengthBound.P_le_loglog"
      module: "PierceLengthBound.Hooley"
      status: proved
      note: "Conditional on NairTenenbaumDelta and BretecheTenenbaumMean."
    - source: "Trajectories with few rises, Theorem 1.5"
      lean: "PierceLengthBound.P_le_rises"
      module: "PierceLengthBound.RisesMain"
      status: proved
    - source: "Positive integer Hankel hierarchy, Theorem 6.2"
      lean: "PierceLengthBound.hankelInv_pos_int"
      module: "PierceLengthBound.Hankel"
      status: proved
      note: "For i < P(a,b) and r ≤ P(a,b) - i, including r = 0."
    - source: "First four Hankel invariants, Theorem 6.2"
      lean: "PierceLengthBound.hankelInv_first_four"
      module: "PierceLengthBound.Hankel"
      status: proved
      note: "I_1 = b_i, I_2 = d_i, I_3 = D_i (i + 3 < P(a,b)) and I_4 = L_i (i + 5 < P(a,b))."

