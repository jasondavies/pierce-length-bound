# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Bounds for the iteration x ↦ a mod x"
  description: >-
    For integers 0 < b < a, let P(a,b) count the positive terms obtained by
    repeatedly replacing x by a mod x, starting at b. This development proves
    the uniform bound P(a,b) ≤ C_ε a^((41301 - 3 sqrt(82849))/137480 + ε) for every
    ε > 0, including the external coefficient-uniform affine-curve theorem and
    the effective Hilbert specialization sieve, and its rational instance
    4317/14677. It also proves the exterior-lattice exponents
    471/1559 - 6 sqrt(105)/7795 and 153/520, the joint-invariant exponents
    (1310-sqrt(655))/4365, 2201/7480 and 128/435 and the earlier exponents
    45/152, 8/27, 11/37, 23/77, and 3/10. It also proves
    a bound O(a^(1/4) sqrt R), where R minus one counts rises in the quotient
    increments, and positivity and integrality of the orbit's Hankel invariants.
    A separate conditional theorem gives O(a^(3/10) sqrt(log log(3a))) assuming
    two explicitly stated analytic estimates whose proofs are not formalized.
    The polar bound uses the proved orbit identity, actual common-base bound
    of four, degree-twelve residue labels, uniform arithmetic specialization
    count, and full-pattern completion count with arbitrary common divisors.
    These establish the six-term local estimate without additional hypotheses.
    The conjectured O((log a)^2) bound remains open.
  authors: ["Jason Davies"]
  license: "Apache-2.0"
  responsible_maintainers: ["Jason Davies"]

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A67", "11N37", "11H06"]

sources:
  - title: "Bounds for the Length of Finite Pierce Expansions"
    authors: ["Jason Davies"]
    type: original-proof
    relationship: other
    location: "paper/pierce_length_bound.tex and paper/pierce_length_bound.pdf in this repository"
    note: >-
      The paper accompanying this substantive Lean development presents the
      argument, including the intermediate bounds, structured trajectories,
      and the Hankel hierarchy. The original claim concerns this development;
      no claim is made to have resolved Shallit's logarithmic conjecture.
  - title: "A discrete iteration related to Pierce expansions"
    authors: ["Jeffrey O. Shallit"]
    type: web post
    id: "https://www.openproblemgarden.org/op/a_discrete_iteration_related_to_pierce_expansions"
    relationship: background
    note: "Problem statement, logarithmic conjecture, and the example P(35,22) = 7."
  - title: "On the length of Pierce expansions"
    authors: ["Zachary Chase", "Mayank Pandey"]
    type: preprint
    id: "https://arxiv.org/abs/2211.08374"
    relationship: background
    note: >-
      Prior bound with exponent 1/3 - 2/177 + epsilon. Its proof is not
      formalized or used as a hypothesis in this repository.
  - title: "The dimension growth conjecture, polynomial in the degree and without logarithmic factors"
    authors: ["Wouter Castryck", "Raf Cluckers", "Philip Dittmann", "Kien Huu Nguyen"]
    type: article
    location: "Algebra & Number Theory 14 (2020), no. 8, 2261–2294, Theorem 3"
    id: "https://doi.org/10.2140/ant.2020.14.2261"
    relationship: other
    note: >-
      The coefficient-uniform affine-curve estimate is proved in the separate
      ccdn-linear-growth project and imported as the Lake package
      ccdn_dimension_growth, a Git dependency pinned to commit
      9ade6200d053ceef5f6ccc4154ae30c6056be150. It is not an unproved hypothesis or axiom.
  - title: "Improvements on dimension growth results and effective Hilbert's irreducibility theorem"
    authors: ["Raf Cluckers", "Pierre Dèbes", "Yotam I. Hendel", "Kien Huu Nguyen", "Floris Vermeulen"]
    type: article
    location: "Forum of Mathematics, Sigma 13 (2025), e153, Theorem 1.10"
    id: "https://doi.org/10.1017/fms.2025.10096"
    relationship: background
    note: >-
      The required monic specialization theorem is proved in this repository,
      following the effective Hilbert irreducibility argument: coefficient
      resolvents and integral specialization, the CCDN curve bound, Kronecker
      substitution, and induction over the parameters. Fixed-degree monic
      normalization makes it applicable to the explicit branch-label family.
      It is a proved input, not an additional hypothesis or axiom. This does
      not claim a formalization of every result in the cited paper.
  - title: "Short sums of certain arithmetic functions"
    authors: ["M. Nair", "Gérald Tenenbaum"]
    type: article
    location: "Acta Mathematica 180 (1998), 119–144"
    id: "https://tenenb.perso.math.cnrs.fr/PPP/ShortSums.pdf"
    relationship: other
    note: >-
      The displayed consequence of Theorem 1 for F = Delta, Q(X) = X,
      and interval exponent 1/4 is stated as NairTenenbaumDelta. It is an
      explicit hypothesis of P_le_loglog; its proof is not formalized.
  - title: "Bounds for sets of remainders"
    authors: ["Omkar Baraskar", "Ingrid Vukusic"]
    type: preprint
    id: "https://arxiv.org/abs/2508.20853"
    relationship: background
    note: >-
      Related work on the cardinalities of iterated remainder sets at fixed
      depth, cited for context; not used as a formal dependency.
  - title: "Note on the mean value of the Erdős–Hooley Delta-function"
    authors: ["Régis de la Bretèche", "Gérald Tenenbaum"]
    type: article
    location: "Acta Arithmetica 219 (2025), no. 4, 379–394, Theorem 1.1"
    id: "https://arxiv.org/abs/2309.03958"
    relationship: other
    note: >-
      The mean-value bound is stated as BretecheTenenbaumMean. It is an
      explicit hypothesis of P_le_loglog; its proof is not formalized.
  - title: "Talks"
    authors: ["Jeffrey O. Shallit"]
    type: web page
    id: "https://cs.uwaterloo.ca/~shallit/talks.html"
    relationship: background
    note: >-
      Reports an unpublished n^(3/10) bound. Used only for context on prior
      results, not as a formal dependency or a claim of independent review.

related_formalizations:
  - id: "https://github.com/jasondavies/ccdn-linear-growth/tree/9ade6200d053ceef5f6ccc4154ae30c6056be150"
    relationship: builds-on
    note: >-
      The coefficient-uniform affine-curve theorem CCDN.affineCurveBound, imported as
      the pinned Lake dependency ccdn_dimension_growth. That project itself vendors
      the Bombieri–Vaaler development of rwst/Subspace-Theorems at commit
      09835cb23557ae5ae0cf55a9c4ab9055f5d60338 and adapts Mertens' first theorem from
      PrimeNumberTheoremAnd at commit c39a751132c88b6e8080b74c74023fd95b3d8be0, with
      provenance recorded in its vendor directory.
  - id: "https://github.com/openai/math/tree/1581d4cbdd69a0faf34b2089614fe2a814316a6a"
    relationship: builds-on
    note: >-
      The divisor bound exists_divisors_power_bound is vendored from
      OAI/NumberTheory/Ostmann/Preliminaries/DivisorPowerBound.lean at this
      immutable revision. Imports and module visibility have been adapted;
      proof bodies are unchanged. See vendor/openai-math/UPSTREAM.md.

status:
  scope: >-
    Comparator is configured for the main theorems listed in alignment below.
    Their definitions are given in full in the independent Mathlib-only
    Challenge module. The proof development has no sorry holes or custom
    axioms. The deliberate theorem holes in Challenge.lean are excluded
    from these counts. NairTenenbaumDelta and BretecheTenenbaumMean are
    unproved propositions passed as hypotheses, not axioms. The selected
    polar-projection bounds are unconditional: PolarProjectionMain supplies
    the proved six-term counting estimates to the general exponent reductions.
    The paper's
    background literature and its remark about Shiu's theorem are not
    claimed as formalized results. The O((log a)^2) conjecture is not proved.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: other
      tool_setup: >-
        AI-assisted mathematical development using GPT-6-Astra, as identified
        by the maintainer, with contributions described in the paper's
        acknowledgements. The division of implementation work in the original
        development has not been recorded here.
    - method: agent
      framework: "OpenAI Codex"
      tool_setup: >-
        Repository review and Palomar preparation: statement and proof review,
        exact-rational numerical checks, Lean builds and axiom audits,
        module-system migration, independent Challenge and Comparator setup,
        metadata, and CI preparation. Subsequent work formalized the rational curve
        geometry, normalization and valuation arguments, joint-invariant graphs,
        powered counting and the optimized joint-invariant exponent, the
        exterior-lattice bounds, and the external curve-counting theorem. The
        polar-projection work formalized the orbit identities, branch algebra,
        hypersurface-pattern count, actual local intersection bound, effective
        Hilbert irreducibility, specialization-compatible branch labels,
        full-pattern completion count, and both unconditional polar exponents.
  notes: >-
    The paper credits AI language models with contributions to the orthogonal
    polynomial and adjacent-label approach, the resultant bound, bounded
    multiplicity, sign identities and slice counting, the Plücker-vector
    interpretation, and weighting minor vectors by shortest lattice vectors.
    Lean and Mathlib check the formal proofs. This is distinct from a human
    review of the mathematical claims, definitions, or originality.

fidelity:
  divergences: >-
    No known mismatch between the compared Lean statements and their
    descriptions in the accompanying paper. The log-log result explicitly
    assumes two published analytic statements instead of formalizing their
    proofs. The polar-projection refinement proves its six-term local counting
    estimate, including all arithmetic and geometric inputs.
    The natural-number orbit is frozen at zero, and P counts positive terms;
    both the paper and orb use zero-based indexing.

review:
  status: "agent-reviewed"
  reviewers: ["OpenAI Codex"]
  notes: >-
    Latest run, October 23, 2026, with the CCDN dependency pinned to
    9ade6200d053ceef5f6ccc4154ae30c6056be150: the Lean build, both weighted-count
    dependency audits and the axiom audit passed. The axiom audit covers every
    exported PierceLengthBound, CCDN and vendored ArithmeticHeights declaration and
    allows only propext, Classical.choice and Quot.sound. In an isolated copy with
    matching Lean sources and dependency configuration, the standard sandboxed
    Comparator accepted all fifteen selected statements with Lean, NanoDa and con-ron;
    con-ron verified 91,574 declarations. The axiom audit covered 3,953
    PierceLengthBound, 1,196 CCDN and 555 ArithmeticHeights declarations.
    The new scripts/check-polar-projection.py independently recomputed the
    polar and base-point identities, quartic certificate, irreducible sextic
    specialization and polar exponent arithmetic using SymPy.
    The additional scripts/verify-polar-kernels.py replay accepted thirty-two
    principal polar endpoints with Lean, NanoDa and con-ron at their standard
    limits; con-ron verified 90,565 declarations and NanoDa checked 93,163.
    This includes the proved six-term estimate, its arithmetic sieve, the actual
    common-base bound, and the general exponent reductions. These supplementary
    statements are not independently compared with Challenge; the fifteen public
    statements are checked separately by Comparator.
    Earlier checker resource failures were repaired by making coefficient
    conversions explicit and separating monic irreducibility transfer into
    smaller lemmas, without changing hypotheses or checker limits.
    An October 19, 2026 Codex review, which predates the joint-invariant and
    exterior-lattice bounds, read the full paper, checked the definitions and
    theorem statements against it, and inspected the main proof dependencies. It
    corrected the description of quadratic nondegeneracy, the Nair–Tenenbaum
    parameter mapping, and the scope of the no-sorry claim. The reproducible
    scripts/check-math.py checks 26,554 exact-rational Hankel determinants through
    order six on 2,274 orbits, plus curvature, six-step, pattern, quartic and minor
    identities.
    The subsequent full repository and manuscript review clarified the integer
    specialization domain and degree/height conventions, supplied the branch-label
    and common-base arguments, explained the hypersurface-pattern estimate, and
    reorganized the exposition around the strongest bound. It also corrected the
    orbit indexing in documentation and distinguished CI from manual release checks.
    The weighted-count audit now explicitly excludes all three half-weight estimates;
    direct and transitive negative checks confirmed that those dependencies are
    rejected. A fresh Lean build, axiom audit, source and dependency checks, and exact
    arithmetic checks passed. The displayed quartic and finite-field certificates
    were independently recomputed with exact arithmetic. The revised PDF builds
    without LaTeX warnings, and its theorem numbers match the alignment below.
    The Lean theorem statements and proof bodies are unchanged by this revision.
    This is an automated review, not independent human peer review. The existing
    provenance record reports no additional human review; the maintainer has
    identified GPT-6-Astra but has not further specified personal review coverage.
    Full Palomar mechanical preflight remains outstanding. No
    external endorsement is claimed.

alignment:
  namespace: "PierceLengthBound"
  statements:
    - source: "Optimized polar-projection bound, Theorem 1.1"
      lean: "PierceLengthBound.P_le_polar_optimal"
      module: "PierceLengthBound.PolarProjectionMain"
      status: proved
      note: "Uniform in a and b, including proved curve counting and effective Hilbert irreducibility."
    - source: "Rational polar-projection bound, Theorem 1.1 with (m, n) = (3, 2)"
      lean: "PierceLengthBound.P_le_4317_14677"
      module: "PierceLengthBound.PolarProjectionMain"
      status: proved
    - source: "Optimized exterior-lattice bound, Theorem 1.2"
      lean: "PierceLengthBound.P_le_lattice_optimal"
      module: "PierceLengthBound.LatticeJointMain"
      status: proved
      note: "Uniform in a and b, including the proved external curve theorem."
    - source: "Rational exterior-lattice bound, Corollary 9.12 with (m, n) = (3, 2)"
      lean: "PierceLengthBound.P_le_153_520"
      module: "PierceLengthBound.LatticeJointMain"
      status: proved
    - source: "Optimized joint-invariant bound, Theorem 1.3"
      lean: "PierceLengthBound.P_le_joint_optimal"
      module: "PierceLengthBound.JointLiftMain"
      status: proved
      note: "Uniform in a and b, including the proved external curve theorem."
    - source: "Rational powered joint-invariant bound, Corollary 8.14 with (m, n) = (50, 51)"
      lean: "PierceLengthBound.P_le_2201_7480"
      module: "PierceLengthBound.JointLiftMain"
      status: proved
    - source: "Unpowered joint-invariant bound, Corollary 8.14 with (m, n) = (1, 1)"
      lean: "PierceLengthBound.P_le_128_435"
      module: "PierceLengthBound.JointLiftMain"
      status: proved
    - source: "Earlier lattice bound, Section 1 (Intermediate bounds)"
      lean: "PierceLengthBound.P_le_45_152"
      module: "PierceLengthBound.FortyFiveMain"
      status: proved
      note: "Uniform in a and b; C may depend on the positive epsilon."
    - source: "Minor-vector counting bound, Section 1 (Intermediate bounds)"
      lean: "PierceLengthBound.P_le_8_27"
      module: "PierceLengthBound.EightMain"
      status: proved
    - source: "Ternary slicing bound, Section 1 (Intermediate bounds)"
      lean: "PierceLengthBound.P_le_11_37"
      module: "PierceLengthBound.ElevenMain"
      status: proved
    - source: "Seven-integer pattern bound, Section 1 (Intermediate bounds)"
      lean: "PierceLengthBound.P_le_23_77"
      module: "PierceLengthBound.TwentyThreeMain"
      status: proved
    - source: "Unconditional 3/10 bound, Theorem 1.4"
      lean: "PierceLengthBound.P_le"
      module: "PierceLengthBound.Main"
      status: proved
    - source: "Conditional logarithmic refinement, Section 1 (Intermediate bounds)"
      lean: "PierceLengthBound.P_le_loglog"
      module: "PierceLengthBound.Hooley"
      status: proved
      note: "Conditional on NairTenenbaumDelta and BretecheTenenbaumMean."
    - source: "Trajectories with few rises, Theorem 1.5"
      lean: "PierceLengthBound.P_le_rises"
      module: "PierceLengthBound.RisesMain"
      status: proved
    - source: "Positive integer Hankel hierarchy, Theorem 6.2"
      lean: "PierceLengthBound.hankelInv_pos_int"
      module: "PierceLengthBound.Hankel"
      status: proved
      note: "For i < P(a,b) and r ≤ P(a,b) - i, including r = 0."

