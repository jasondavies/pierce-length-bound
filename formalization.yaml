# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Bounds for the iteration x ↦ a mod x"
  description: >-
    For integers 0 < b < a, let P(a,b) count the positive terms obtained by
    repeatedly replacing x by a mod x, starting at b. This development proves
    the uniform bound P(a,b) ≤ C_ε a^(45/152 + ε) for every ε > 0, together
    with the earlier exponents 8/27, 11/37, 23/77, and 3/10. It also proves
    a bound O(a^(1/4) sqrt R), where R minus one counts rises in the quotient
    increments, and positivity and integrality of the orbit's Hankel invariants.
    A separate conditional theorem gives O(a^(3/10) sqrt(log log(3a))) assuming
    two explicitly stated analytic estimates whose proofs are not formalized.
    The conjectured O((log a)^2) bound remains open.
  authors: ["Jason Davies"]
  license: "Apache-2.0"
  responsible_maintainers: ["Jason Davies"]

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A67", "11N37", "11H06"]

sources:
  - title: "The iteration x → a mod x has length O(a^(45/152+epsilon))"
    authors: ["Jason Davies"]
    type: original-proof
    relationship: other
    location: "paper/pierce_bound.tex and paper/pierce_bound.pdf in this repository"
    note: >-
      The paper accompanying this substantive Lean development presents the
      argument, including the intermediate bounds, structured trajectories,
      and the Hankel hierarchy. The original claim concerns this development;
      no claim is made to have resolved Shallit's logarithmic conjecture.
  - title: "A discrete iteration related to Pierce expansions"
    authors: ["Jeffrey O. Shallit"]
    type: web post
    id: "https://www.openproblemgarden.org/op/a_discrete_iteration_related_to_pierce_expansions"
    relationship: background
    note: "Problem statement, logarithmic conjecture, and the example P(35,22) = 7."
  - title: "On the length of Pierce expansions"
    authors: ["Zachary Chase", "Mayank Pandey"]
    type: preprint
    id: "https://arxiv.org/abs/2211.08374"
    relationship: background
    note: >-
      Prior bound with exponent 1/3 - 2/177 + epsilon. Its proof is not
      formalized or used as a hypothesis in this repository.
  - title: "Short sums of certain arithmetic functions"
    authors: ["M. Nair", "Gérald Tenenbaum"]
    type: article
    location: "Acta Mathematica 180 (1998), 119–144"
    id: "https://tenenb.perso.math.cnrs.fr/PPP/ShortSums.pdf"
    relationship: other
    note: >-
      The displayed consequence of Theorem 1 for F = Delta, Q(X) = X,
      and interval exponent 1/4 is stated as NairTenenbaumDelta. It is an
      explicit hypothesis of P_le_loglog; its proof is not formalized.
  - title: "Note on the mean value of the Erdős–Hooley Delta-function"
    authors: ["Régis de la Bretèche", "Gérald Tenenbaum"]
    type: article
    location: "Acta Arithmetica 219 (2025), no. 4, 379–394, Theorem 1.1"
    id: "https://arxiv.org/abs/2309.03958"
    relationship: other
    note: >-
      The mean-value bound is stated as BretecheTenenbaumMean. It is an
      explicit hypothesis of P_le_loglog; its proof is not formalized.
  - title: "Talks"
    authors: ["Jeffrey O. Shallit"]
    type: web page
    id: "https://cs.uwaterloo.ca/~shallit/talks.html"
    relationship: background
    note: >-
      Reports an unpublished n^(3/10) bound. Used only for context on prior
      results, not as a formal dependency or a claim of independent review.

related_formalizations:
  - id: "https://github.com/openai/math/tree/1581d4cbdd69a0faf34b2089614fe2a814316a6a"
    relationship: builds-on
    note: >-
      The divisor bound exists_divisors_power_bound is vendored from
      OAI/NumberTheory/Ostmann/Preliminaries/DivisorPowerBound.lean at this
      immutable revision. Imports and module visibility have been adapted;
      proof bodies are unchanged. See vendor/openai-math/UPSTREAM.md.

status:
  scope: >-
    Comparator covers the eight main theorems listed in alignment below.
    Their definitions are given in full in the independent Mathlib-only
    Challenge module. The proof development has no sorry holes or custom
    axioms. The eight deliberate theorem holes in Challenge.lean are excluded
    from these counts. NairTenenbaumDelta and BretecheTenenbaumMean are
    unproved propositions passed as hypotheses, not axioms. The paper's
    background literature and its remark about Shiu's theorem are not
    claimed as formalized results. The O((log a)^2) conjecture is not proved.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: other
      tool_setup: >-
        AI-assisted mathematical development, as described in the paper's
        acknowledgements. The model identities and division of implementation
        work in the original development have not been recorded here.
    - method: agent
      framework: "OpenAI Codex"
      tool_setup: >-
        Repository review and Palomar preparation: statement and proof review,
        exact-rational numerical checks, Lean builds and axiom audits,
        module-system migration, independent Challenge and Comparator setup,
        metadata, and CI preparation.
  notes: >-
    The paper credits AI language models with contributions to the orthogonal
    polynomial and adjacent-label approach, the resultant bound, bounded
    multiplicity, sign identities and slice counting, the Plücker-vector
    interpretation, and weighting minor vectors by shortest lattice vectors.
    Lean and Mathlib check the formal proofs. This is distinct from a human
    review of the mathematical claims, definitions, or originality.

fidelity:
  divergences: >-
    No known mismatch between the eight compared Lean statements and their
    descriptions in the accompanying paper. The conditional result explicitly
    assumes two published analytic statements instead of formalizing their
    proofs. The natural-number orbit is frozen at zero, and P counts positive
    terms; the paper's indexing starts at one while orb starts at zero.

review:
  status: "agent-reviewed"
  reviewers: ["OpenAI Codex"]
  notes: >-
    A Codex review inspected the Lean development, theorem statements,
    dependencies, README, and paper; ran the Lean build and eight-theorem axiom
    audit; and performed 8,655 exact-rational Hankel checks on 303 sample
    orbits. No actionable correctness defect was identified. This is an
    automated review, not independent human peer review. The maintainer reports
    no additional human review. No external endorsement or Palomar review is claimed.

alignment:
  namespace: "PierceBound"
  statements:
    - source: "Main bound in the accompanying paper"
      lean: "PierceBound.P_le_45_152"
      module: "PierceBound.FortyFiveMain"
      status: proved
      note: "Uniform in a and b; C may depend on the positive epsilon."
    - source: "Minor-vector counting bound"
      lean: "PierceBound.P_le_8_27"
      module: "PierceBound.EightMain"
      status: proved
    - source: "Ternary slicing bound"
      lean: "PierceBound.P_le_11_37"
      module: "PierceBound.ElevenMain"
      status: proved
    - source: "Seven-integer pattern bound"
      lean: "PierceBound.P_le_23_77"
      module: "PierceBound.TwentyThreeMain"
      status: proved
    - source: "Unconditional 3/10 bound"
      lean: "PierceBound.P_le"
      module: "PierceBound.Main"
      status: proved
    - source: "Conditional logarithmic refinement"
      lean: "PierceBound.P_le_loglog"
      module: "PierceBound.Hooley"
      status: proved
      note: "Conditional on NairTenenbaumDelta and BretecheTenenbaumMean."
    - source: "Trajectories with few rises"
      lean: "PierceBound.P_le_rises"
      module: "PierceBound.RisesMain"
      status: proved
    - source: "Positive integer Hankel hierarchy"
      lean: "PierceBound.hankelInv_pos_int"
      module: "PierceBound.Hankel"
      status: proved
      note: "For i < P(a,b) and r ≤ P(a,b) - i, including r = 0."

acknowledgements: >-
  The Lean and Mathlib communities, the authors of openai/math for the
  formalized divisor bound, and the AI contributions described above and in
  the paper. Jason Davies is the human author and responsible maintainer.
