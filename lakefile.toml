name = "pierce_bound"
version = "0.1.0"
defaultTargets = ["PierceBound", "Challenge", "Solution", "Axioms"]

[leanOptions]
autoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "PierceBound"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Axioms"

[[require]]
name = "openai_math"
path = "vendor/openai-math"
