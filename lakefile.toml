name = "pierce_length_bound"
version = "0.1.0"
defaultTargets = ["PierceLengthBound", "Challenge", "Solution", "Axioms"]

[leanOptions]
autoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "PierceLengthBound"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Axioms"

[[require]]
name = "openai_math"
path = "vendor/openai-math"

[[require]]
name = "ccdn_dimension_growth"
git = "https://github.com/jasondavies/ccdn-linear-growth"
rev = "9ade6200d053ceef5f6ccc4154ae30c6056be150"
