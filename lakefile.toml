name = "pierce_length_bound"
version = "0.1.0"
defaultTargets = ["PierceLengthBound", "PierceLengthBoundPalomar"]

[leanOptions]
autoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "openai_math"
path = "vendor/openai-math"

# The CCDN curve-counting library. Its own lakefile.toml declares the package name
# `ccdn_dimension_growth`, which this name must match.
# scripts/check-curve-counting-dependency.py treats this rev as the single source of truth.
[[require]]
name = "ccdn_dimension_growth"
git = "https://github.com/jasondavies/ccdn-dimension-growth"
rev = "bb025e7207f3a35a21b898629f5678b72aa7e44f"

[[lean_lib]]
name = "PierceLengthBound"

# The Palomar statement surface, its proved counterpart and the axiom checks. They live under
# a project-specific top-level directory because Palomar refuses a Challenge whose top-level
# name is also a top-level entry of a dependency (CCDN has its own Challenge, Solution and
# Axioms). The three roots are independent: Challenge and Solution never import each other.
[[lean_lib]]
name = "PierceLengthBoundPalomar"
roots = ["PierceLengthBoundPalomar.Challenge", "PierceLengthBoundPalomar.Solution",
  "PierceLengthBoundPalomar.Axioms"]
